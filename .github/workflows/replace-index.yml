name: Replace index.html with final page

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html with 3-4.html
        run: |
          ls -l index.html 3-4.html
          rm -f index.html
          git mv 3-4.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Replace index.html with newest final Osaka trip page (hojicha sticks, no hand cream)"
          git push
          ls -l index.html
