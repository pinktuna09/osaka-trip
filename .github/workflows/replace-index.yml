name: Replace index.html

on:
  workflow_dispatch:

jobs:
  replace-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html with 3-4.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm index.html
          git mv 3-4.html index.html
          git commit -m "Replace index.html with latest version (3-4.html)"
          git push
