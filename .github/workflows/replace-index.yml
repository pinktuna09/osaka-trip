name: Replace index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html with 3-4.html
        run: |
          git config user.name "pinktuna09"
          git config user.email "pinktuna09@users.noreply.github.com"
          git mv 3-4.html index.html
          git commit -m "Replace index.html with latest Osaka trip page"
          git push
